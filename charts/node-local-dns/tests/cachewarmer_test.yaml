suite: cache warmer
templates:
  - daemonset.yaml
  - configmap-warm-domains.yaml
release:
  name: node-local-dns
tests:
  - it: renders nothing warmer-related when disabled
    template: daemonset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.metadata.annotations.checksum/warm-domains
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: warm-domains
          any: true

  - it: always carries a Corefile checksum annotation
    template: daemonset.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations.checksum/config
          pattern: "^[a-f0-9]{64}$"

  - it: renders the warm-domains configmap when enabled
    template: configmap-warm-domains.yaml
    set:
      cacheWarmer:
        enabled: true
        domains:
          - registry.example.com
          - api.example.com
    asserts:
      - equal:
          path: metadata.name
          value: node-local-dns-warm-domains
      - matchRegex:
          path: data.domains
          pattern: "registry\\.example\\.com\\napi\\.example\\.com"

  - it: renders the warmer sidecar, volume and checksum when enabled
    template: daemonset.yaml
    set:
      cacheWarmer:
        enabled: true
        domains:
          - registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: cache-warmer
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/warm-domains
      - contains:
          path: spec.template.spec.volumes
          content:
            name: warm-domains
            configMap:
              name: node-local-dns-warm-domains
      - matchRegex:
          path: spec.template.metadata.annotations.checksum/warm-domains
          pattern: "^[a-f0-9]{64}$"

  - it: keeps user-supplied initContainers alongside the warmer
    template: daemonset.yaml
    set:
      cacheWarmer:
        enabled: true
        domains: ["a.example.com"]
      initContainers:
        - name: user-init
          image: busybox:1.37
          command: ["true"]
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: cache-warmer
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: user-init
