apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "node-local-dns.fullname" . }}
  namespace: kube-system
  {{- with .Values.daemonsetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "node-local-dns.labels" . | nindent 4 }}
  {{- with .Values.daemonsetLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "node-local-dns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-local-dns.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* Hash the values driving the Corefile instead of including configmap.yaml,
             so the checksum also renders under helm-unittest's per-suite template scope. */}}
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
        {{- if .Values.cacheWarmer.enabled }}
        checksum/warm-domains: {{ include (print $.Template.BasePath "/configmap-warm-domains.yaml") . | sha256sum }}
        {{- end }}
        {{- if and (not .Values.serviceMonitor.enabled) .Values.prometheusScraping.enabled }}
        prometheus.io/port: "9253"
        prometheus.io/scrape: "true"
        {{- end }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      priorityClassName: system-node-critical
      serviceAccountName: {{ include "node-local-dns.serviceAccountName" . }}
      hostNetwork: {{ .Values.config.setupIptables }}
      dnsPolicy: Default  # Don't use cluster DNS.
      tolerations:
      {{- toYaml .Values.tolerations | nindent 8 }}
      {{- if or .Values.initContainers .Values.cacheWarmer.enabled }}
      initContainers:
        {{- if .Values.cacheWarmer.enabled }}
        - name: cache-warmer
          image: "{{ .Values.cacheWarmer.image.repository }}:{{ .Values.cacheWarmer.image.tag }}"
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                while read -r domain; do
                  [ -n "$domain" ] && nslookup "$domain" {{ .Values.config.localDns }} >/dev/null 2>&1
                done < /etc/warm-domains/domains
                sleep {{ .Values.cacheWarmer.interval }}
              done
          {{- with .Values.cacheWarmer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: warm-domains
              mountPath: /etc/warm-domains
              readOnly: true
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
      - name: node-cache
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        {{- with .Values.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resizePolicy }}
        resizePolicy: {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        {{- if .Values.config.setupIptables }}
          - "-localip"
          - "{{ .Values.config.localDns }},{{ .Values.config.dnsServer }}"
        {{- else }}
          - "-localip"
          - "{{ .Values.config.localDns }}"
        {{- end }}
          - "-conf"
          - "/etc/Corefile"
          - "-upstreamsvc"
        {{- if .Values.config.customUpstreamsvc }}
          - "{{ .Values.config.customUpstreamsvc }}"
        {{- else }}
          - "{{ include "node-local-dns.fullname" . }}-upstream"
        {{- end }}
          - "-skipteardown={{ .Values.config.skipTeardown }}"
          - "-setupinterface={{ .Values.config.setupInterface }}"
          - "-setupiptables={{ .Values.config.setupIptables }}"
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.config.port.number }}
          name: {{ .Values.config.port.udp}}
          protocol: UDP
        - containerPort: {{ .Values.config.port.number }}
          name: {{ .Values.config.port.tcp}}
          protocol: TCP
        - containerPort: 9253
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.config.healthPort }}
          initialDelaySeconds: 60
          timeoutSeconds: 5
        {{- with .Values.lifecycle }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /run/xtables.lock
          name: xtables-lock
          readOnly: false
        - name: config-volume
          mountPath: /etc/coredns
        - name: kube-dns-config
          mountPath: /etc/kube-dns
      volumes:
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
      - name: kube-dns-config
        configMap:
          name: {{ include "node-local-dns.fullname" . }}
          optional: true
      - name: config-volume
        configMap:
          name: {{ include "node-local-dns.fullname" . }}
          items:
            - key: Corefile
              path: Corefile.base
      {{- if .Values.cacheWarmer.enabled }}
      - name: warm-domains
        configMap:
          name: {{ include "node-local-dns.fullname" . }}-warm-domains
      {{- end }}
